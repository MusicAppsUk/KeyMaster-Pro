<div id="root"></div>
<script>
/* Stage mode goes truly full screen (Android/desktop). Leaving for LIBRARY or
   SETLISTS drops back out. Sits outside the app bundle on purpose. */
(function () {
  var el = document.documentElement;
  function enter() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!req) return;
    try { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function leave() {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) return;
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (!ex) return;
    try { var p = ex.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var btn = t && t.closest ? t.closest("button") : null;
    if (!btn) return;
    var label = (btn.textContent || "").trim();
    if (label.indexOf("STAGE") !== -1) enter();
    else if (label === "LIBRARY" || label === "SETLISTS") leave();
  }, true);
})();
</script>

<script>
(async () => {
  try {
    if ("serviceWorker" in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); }
    if (window.caches && caches.keys) { for (const k of await caches.keys()) await caches.delete(k); }
  } catch (e) {}
})();
</script>
<script>
/* PatchMaster v21.2 blueprint history: preserves older rigs before web improvement. */
(function(){
  function ident(song){ return ((song&&song.title)||"").trim().toLowerCase()+"|"+((song&&song.artist)||"").trim().toLowerCase(); }
  function key(song){ return "pm4:history:"+encodeURIComponent(ident(song)); }
  window.PM_HISTORY_SAVE=function(song,engineVersion){
    if(!song||!song.blueprint)return 0;
    try{
      var k=key(song), a=JSON.parse(localStorage.getItem(k)||"[]");
      var snap=JSON.parse(JSON.stringify(song));
      var sig=JSON.stringify(snap.blueprint);
      if(a.length && JSON.stringify(a[0].song&&a[0].song.blueprint)===sig) return a.length;
      a.unshift({saved_at:new Date().toISOString(),engine_version:String(engineVersion||"unknown"),song:snap});
      a=a.slice(0,12); localStorage.setItem(k,JSON.stringify(a)); return a.length;
    }catch(e){return 0;}
  };
  window.PM_HISTORY_LIST=function(song){try{return JSON.parse(localStorage.getItem(key(song))||"[]")}catch(e){return []}};
})();
</script>
